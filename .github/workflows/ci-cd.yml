name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  DOCKER_IMAGE_NAME: mathtrainerdotnet

# Least privilege: no job here writes to the repository. Do not rely on the
# repository-level default, which can change without leaving a diff.
permissions:
  contents: read

# Supersede redundant runs per ref, but never abort a tag publish: a cancelled
# push can leave :latest partially updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --report-xunit-trx --results-directory "TestResults"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (test only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          # load makes the image available to the scanner below; pull re-resolves
          # the base image so the scan cannot pass on a stale cached layer.
          load: true
          pull: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gates docker-publish as well, which needs this job.
      # ignore-unfixed is deliberate: the Debian base will accumulate advisories
      # with no available fix, and failing on those would only get the gate
      # switched off.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-and-test, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    # Publishing is the only step here that reaches outside the repository, so
    # it runs against a named environment. The environment restricts deployment
    # to v* tags independently of the if: condition above, records every publish
    # under Deployments, and is where the Docker Hub credentials should live so
    # they are not readable by every other job in the repository.
    # No url: here on purpose -- DOCKERHUB_USERNAME is currently a secret, so
    # GitHub would mask it and render the link as .../r/***/mathtrainerdotnet.
    # Worth adding once F-10 turns the username into a repository variable.
    environment: dockerhub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract version from tag
        id: version
        run: |
          # Tag ist z.B. refs/tags/v1.0.0 -> extrahiere v1.0.0
          TAG=${GITHUB_REF#refs/tags/}
          # Version ohne 'v' Präfix für Docker Tag
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Version: $VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true
          # Provenance is already emitted by default; an SBOM is not.
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=MathTrainerDotNet
            org.opencontainers.image.description=Blazor Server Math Trainer Application
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.documentation=https://github.com/shinji-san/mathtrainerdotnet/blob/develop/README.md
            org.opencontainers.image.licenses=MIT
