services:
  # ASP.NET Core Blazor Server Anwendung
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathtrainer-app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mathtrainer.db
    volumes:
      # Persistentes Volume für SQLite Datenbank
      - mathtrainer-data:/app/data
    networks:
      - mathtrainer-network
    # Nur intern über nginx erreichbar
    expose:
      - "8080"

  # nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mathtrainer-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Leere default.conf um die nginx-Standard-Konfiguration zu deaktivieren
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mathtrainer-network
    depends_on:
      app:
        condition: service_started

# Persistentes Volume für Datenbank
volumes:
  mathtrainer-data:
    name: mathtrainer-data

# Internes Netzwerk
networks:
  mathtrainer-network:
    name: mathtrainer-network
    driver: bridge
