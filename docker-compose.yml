services:
  # MathTrainer - Blazor Server App with nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathtrainer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent volume for SQLite database
      - mathtrainer-data:/app/data
# Persistent volume for database
volumes:
  mathtrainer-data:
    name: mathtrainer-data
